"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username@${custom.host} in $directory\
$git_branch\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$package\
$c\
$cmake\
$lua\
$nim\
$nodejs\
$python\
$rust\
$nix_shell\
$cmd_duration\
$jobs\
$status\
$line_break\
$character"""

[username]
show_always = true
format = "[$user](cyan)"

[custom.host]
# mirrors the previous zsh prompt's host_info(): strip a "zoltan-" prefix
# from the short hostname, so it's a no-op on hosts without that prefix.
command = "hostname -s"
when = true
format = "[$output](cyan)"

[directory]
style = "cyan"
read_only = " 󰌾"
truncation_length = 1
truncate_to_repo = false

# [git_metrics]
# disabled = false
# format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
# added_style = "bold magenta"
# deleted_style = "bold magenta"
#
# [git_status]
# format = '([$ahead_behind]($style) )'
# ahead = "⇡${count}"
# behind = "⇣${count}"
# diverged = "⇕⇡${ahead_count}⇣${behind_count}"
# style = "bold magenta"

[git_metrics]
disabled=false

[aws]
symbol = "  "

[buf]
symbol = " "

